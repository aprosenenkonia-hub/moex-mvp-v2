services:
  postgres:
    image: postgres:16
    container_name: moex_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: moex
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    container_name: moex_redis
    restart: unless-stopped
    ports: ["6379:6379"]
  backend:
    build: ./backend
    container_name: moex_backend
    restart: unless-stopped
    env_file: [.env]
    depends_on: [postgres, redis]
    ports: ["8000:8000"]
    command: >
      sh -c "alembic upgrade head && python scripts/seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"
  collector:
    build: ./collector
    container_name: moex_collector
    restart: unless-stopped
    env_file: [.env]
    depends_on: [postgres, redis, backend]
  frontend:
    build: ./frontend
    container_name: moex_frontend
    restart: unless-stopped
    env_file: [.env]
    depends_on: [backend]
    ports: ["3000:3000"]
  nginx:
    image: nginx:latest
    container_name: moex_nginx
    restart: unless-stopped
    depends_on: [frontend, backend]
    ports: ["80:80"]
    volumes: ["./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
volumes:
  postgres_data:
